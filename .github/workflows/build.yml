name: E-Wallet CI Pipeline

on:
  push:
    branches: [ "main", "feat/**", "feat-*", "Feat*", "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'eWallet/pom.xml'

      - name: Start PostgreSQL Database
        run: |
          docker compose up -d postgres
          echo "Waiting for PostgreSQL database to be ready..."
          until docker exec ewallet-db pg_isready -U postgres; do
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run Unit & Mock Tests
        run: |
          cd eWallet
          chmod +x mvnw
          ./mvnw clean test

      - name: Build Application Package
        run: |
          cd eWallet
          ./mvnw package -DskipTests
