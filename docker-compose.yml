services:
  postgres:
    image: postgres:16
    container_name: ewallet-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (see .env.example)}
      POSTGRES_DB: ewallet_db
    ports:
      - "5433:5432"

  app:
    build:
      context: ./eWallet
      dockerfile: Dockerfile

    container_name: ewallet-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ewallet_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (see .env.example)}
    depends_on:
      - postgres
    restart: unless-stopped
