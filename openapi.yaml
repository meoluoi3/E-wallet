openapi: 3.0.3
info:
  title: E-Wallet Core Backend API
  version: 1.0.0
  contact:
    name: E-Wallet UET Team
servers:
  - url: http://localhost:8080

tags:
  - name: Authentication
    description: Đăng ký tài khoản, đăng nhập cấp phát JWT
  - name: Account & Wallet
    description: Quản lý ví cá nhân, số dư, nạp tiền và đóng tài khoản
  - name: Transactions
    description: Chuyển tiền ngang hàng P2P và tra cứu lịch sử giao dịch

paths:
  # ==========================================
  # AUTHENTICATION APIs
  # ==========================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản & Mở ví
      description: Tạo người dùng mới và tự động mở một ví điện tử gắn kèm với số dư 0 VND.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập hệ thống
      description: Xác thực người dùng bằng username/password và cấp phát JWT Access Token (hạn 60 phút).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ACCOUNT & WALLET APIs
  # ==========================================
  /accounts/me:
    get:
      tags:
        - Account & Wallet
      summary: Tra cứu thông tin ví & Số dư
      description: Lấy thông tin ví và số dư khả dụng của tài khoản đang đăng nhập từ JWT.
      operationId: getMyWallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin ví thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Account & Wallet
      summary: Đóng tài khoản người dùng
      description: |
        Đóng vĩnh viễn ví và tài khoản người dùng (Soft Delete).
        **Tiền điều kiện:** Số dư ví bắt buộc phải chính xác bằng 0.00 VND.
      operationId: closeAccount
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          description: Số dư ví vẫn còn tiền (> 0 VND), từ chối đóng tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 1001
                message: Không thể đóng tài khoản khi số dư ví lớn hơn 0 VND
                result: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/me/deposits:
    post:
      tags:
        - Account & Wallet
      summary: Nạp tiền vào ví
      description: Nạp thêm tiền vào ví của chính mình (Hạn mức 10.000 - 50.000.000 VND/lần).
      operationId: deposit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Nạp tiền thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # TRANSACTIONS APIs
  # ==========================================
  /transfers:
    post:
      tags:
        - Transactions
      summary: Chuyển tiền ngang hàng (P2P Transfer)
      description: |
        Chuyển tiền sang ví người dùng khác theo Số điện thoại hoặc Username.
        Áp dụng khóa 2 ví theo thứ tự ID tăng dần để loại trừ triệt để Deadlock và Race Condition.
      operationId: transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Chuyển tiền thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions:
    get:
      tags:
        - Transactions
      summary: Lấy lịch sử giao dịch (Phân trang & Lọc)
      description: Truy vấn danh sách giao dịch mà người dùng tham gia (là người gửi hoặc người nhận).
      operationId: getTransactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/TransactionTypeQueryParam'
      responses:
        '200':
          description: Lấy danh sách giao dịch thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Xem chi tiết một giao dịch
      description: |
        Tra cứu thông tin chi tiết một giao dịch cụ thể theo ID.
        **Kiểm soát quyền truy cập (Chống IDOR):** Người dùng chỉ được xem nếu là bên gửi hoặc bên nhận.
      operationId: getTransactionDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionIdPathParam'
      responses:
        '200':
          description: Lấy chi tiết giao dịch thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ==============================================================================
# COMPONENTS (CÁC THÀNH PHẦN DÙNG CHUNG TẬP TRUNG)
# ==============================================================================
components:
  # ----------------------------------------------------------------------------
  # 1. SECURITY SCHEMES (CƠ CHẾ XÁC THỰC DÙNG CHUNG)
  # ----------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Chuỗi JWT Access Token (không cần thêm tiền tố 'Bearer ')

  # ----------------------------------------------------------------------------
  # 2. PARAMETERS (THAM SỐ TRUY VẤN DÙNG CHUNG)
  # ----------------------------------------------------------------------------
  parameters:
    PageQueryParam:
      name: page
      in: query
      description: Chỉ số trang hiện tại (bắt đầu từ 0)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0

    SizeQueryParam:
      name: size
      in: query
      description: Số lượng phần tử trên mỗi trang (tối thiểu 1, tối đa 50)
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50
      example: 10

    TransactionTypeQueryParam:
      name: type
      in: query
      description: Lọc theo loại giao dịch
      required: false
      schema:
        type: string
        enum: [ALL, DEPOSIT, TRANSFER]
        default: ALL
      example: ALL

    TransactionIdPathParam:
      name: id
      in: path
      description: ID định danh bản ghi giao dịch
      required: true
      schema:
        type: integer
        format: int64
      example: 102

  # ----------------------------------------------------------------------------
  # 3. RESPONSES (CÁC PHẢN HỒI LỖI & PHẢN HỒI CHUẨN DÙNG CHUNG)
  # ----------------------------------------------------------------------------
  responses:
    NoContentResponse:
      description: 204 No Content - Thao tác thành công, không có nội dung trả về

    BadRequestError:
      description: 400 Bad Request - Dữ liệu đầu vào không hợp lệ hoặc vi phạm kiểm tra ràng buộc
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1001
            message: Dữ liệu đầu vào không hợp lệ (Validation Error)
            result: null

    UnauthorizedError:
      description: 401 Unauthorized - Chưa xác thực hoặc Token JWT không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1002
            message: Token không hợp lệ hoặc đã hết hạn
            result: null

    ForbiddenError:
      description: 403 Forbidden - Không có quyền truy cập tài nguyên của người khác (IDOR) hoặc tài khoản bị khóa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1003
            message: Bạn không có quyền truy cập tài nguyên này
            result: null

    NotFoundError:
      description: 404 Not Found - Không tìm thấy User, Ví hoặc Giao dịch được yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1004
            message: Tài nguyên không tồn tại trong hệ thống
            result: null

    ConflictError:
      description: 409 Conflict - Dữ liệu bị trùng lặp (Username, Phone hoặc Email đã tồn tại)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 1005
            message: Tên đăng nhập, số điện thoại hoặc email đã được sử dụng
            result: null

    UnprocessableEntityError:
      description: 422 Unprocessable Entity - Vi phạm quy tắc nghiệp vụ (Số dư không đủ hoặc tự chuyển cho chính mình)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficientBalance:
              summary: Số dư ví không đủ
              value:
                code: 2001
                message: Số dư khả dụng trong ví không đủ để thực hiện giao dịch
                result: null
            selfTransfer:
              summary: Tự chuyển tiền cho chính mình
              value:
                code: 2002
                message: Không thể tự chuyển tiền cho chính mình
                result: null

    InternalServerError:
      description: 500 Internal Server Error - Lỗi hệ thống nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 9999
            message: Lỗi hệ thống nội bộ, vui lòng thử lại sau
            result: null

  # ----------------------------------------------------------------------------
  # 4. SCHEMAS (CÁC MÔ HÌNH DỮ LIỆU DÙNG CHUNG)
  # ----------------------------------------------------------------------------
  schemas:
    # --- 4.1. Kiểu dữ liệu cơ sở & Enums dùng chung ---
    MoneyAmount:
      type: number
      format: double
      description: Số tiền tài chính (định dạng 2 chữ số thập phân, lớn hơn 0)
      example: 150000.00

    CurrencyCode:
      type: string
      description: Đơn vị tiền tệ chuẩn ISO
      enum: [VND]
      default: VND
      example: VND

    AccountStatus:
      type: string
      description: Trạng thái hoạt động của User hoặc Ví
      enum: [ACTIVE, LOCKED, CLOSED]
      example: ACTIVE

    TransactionType:
      type: string
      description: Phân loại giao dịch tài chính
      enum: [DEPOSIT, TRANSFER]
      example: TRANSFER

    TransactionStatus:
      type: string
      description: Trạng thái xử lý của giao dịch
      enum: [PENDING, PROCESSING, SUCCESS, FAILED]
      example: SUCCESS

    FlowDirection:
      type: string
      description: Chiều dòng tiền đối với ví hiện tại (IN = Tiền vào, OUT = Tiền ra)
      enum: [IN, OUT]
      example: OUT

    # --- 4.2. Khung bao bọc phản hồi chung (Response Envelopes) ---
    BaseApiResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Mã định danh nghiệp vụ (1000 = Thành công, 1001-9999 = Lỗi)
          example: 1000
        message:
          type: string
          description: Thông điệp giải thích kết quả xử lý
          example: Thao tác thành công

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            result:
              type: object
              nullable: true
              description: Luôn là null hoặc danh sách lỗi validation chi tiết khi thất bại
              example: null

    PageMetadata:
      type: object
      description: Thông tin phân trang theo chuẩn Spring Page
      required:
        - pageNumber
        - pageSize
        - totalElements
        - totalPages
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 2
        totalPages:
          type: integer
          example: 1

    # --- 4.3. Các Request Body Models ---
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - fullName
        - phoneNumber
        - email
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
          example: tuan_dinh
          description: Tên đăng nhập duy nhất
        password:
          type: string
          minLength: 8
          example: Password123@
          description: Mật khẩu bảo mật
        fullName:
          type: string
          maxLength: 100
          example: Đinh Quang Tuân
          description: Họ và tên người dùng
        phoneNumber:
          type: string
          pattern: '^(0[35789])[0-9]{8}$'
          example: '0987654321'
          description: Số điện thoại định danh Việt Nam
        email:
          type: string
          format: email
          example: tuan@example.com
          description: Địa chỉ email duy nhất

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: tuan_dinh
        password:
          type: string
          example: Password123@

    DepositRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          minimum: 10000.00
          maximum: 50000000.00
          example: 200000.00
          description: Số tiền nạp vào ví (10.000 - 50.000.000 VND)
        description:
          type: string
          maxLength: 255
          example: Nạp tiền ngân hàng mô phỏng
          description: Ghi chú giao dịch nạp

    TransferRequest:
      type: object
      required:
        - recipientIdentifier
        - amount
      properties:
        recipientIdentifier:
          type: string
          example: '0912345678'
          description: Số điện thoại hoặc Username người nhận
        amount:
          type: number
          format: double
          minimum: 1000.00
          maximum: 100000000.00
          example: 150000.00
          description: Số tiền chuyển (Tối thiểu 1.000 VND)
        description:
          type: string
          maxLength: 255
          example: Chuyển tiền ăn tối
          description: Lời nhắn chuyển tiền

    # --- 4.4. Dữ liệu thực thể DTO (Domain Data Objects) ---
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: tuan_dinh
        fullName:
          type: string
          example: Đinh Quang Tuân
        phoneNumber:
          type: string
          example: '0987654321'
        email:
          type: string
          format: email
          example: tuan@example.com
        walletId:
          type: integer
          format: int64
          example: 1
        balance:
          $ref: '#/components/schemas/MoneyAmount'

    TokenDTO:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 3600

    WalletDTO:
      type: object
      properties:
        walletId:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 1
        ownerName:
          type: string
          example: Đinh Quang Tuân
        balance:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/AccountStatus'

    DepositTransactionDTO:
      type: object
      properties:
        transactionId:
          type: integer
          format: int64
          example: 101
        transactionCode:
          type: string
          example: DEP-7f3b8a1c-9e2d-4c5b
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currentBalance:
          $ref: '#/components/schemas/MoneyAmount'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T22:30:00'

    TransferTransactionDTO:
      type: object
      properties:
        transactionId:
          type: integer
          format: int64
          example: 102
        transactionCode:
          type: string
          example: TRF-4e7a8b1c-3d2e-11ec
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        recipientName:
          type: string
          example: Lê Tùng Dương
        recipientPhone:
          type: string
          example: '0912345678'
        remainingBalance:
          $ref: '#/components/schemas/MoneyAmount'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T22:35:00'

    TransactionSummaryDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 102
        transactionCode:
          type: string
          example: TRF-4e7a8b1c-3d2e-11ec
        type:
          $ref: '#/components/schemas/TransactionType'
        direction:
          $ref: '#/components/schemas/FlowDirection'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        counterpart:
          type: string
          example: Lê Tùng Dương (0912345678)
        description:
          type: string
          example: Chuyển tiền ăn tối
        status:
          $ref: '#/components/schemas/TransactionStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T22:35:00'

    TransactionPageDTO:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TransactionSummaryDTO'

    TransactionDetailDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 102
        transactionCode:
          type: string
          example: TRF-4e7a8b1c-3d2e-11ec
        type:
          $ref: '#/components/schemas/TransactionType'
        direction:
          $ref: '#/components/schemas/FlowDirection'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        senderName:
          type: string
          example: Đinh Quang Tuân
        receiverName:
          type: string
          example: Lê Tùng Dương
        description:
          type: string
          example: Chuyển tiền ăn tối
        status:
          $ref: '#/components/schemas/TransactionStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T22:35:00'

    # --- 4.5. Các Response Envelope cụ thể (Kế thừa BaseApiResponse) ---
    RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/UserDTO'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/TokenDTO'

    WalletResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/WalletDTO'

    DepositResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/DepositTransactionDTO'

    TransferResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/TransferTransactionDTO'

    TransactionPageResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/TransactionPageDTO'

    TransactionDetailResponse:
